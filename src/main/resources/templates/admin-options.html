<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基础选项管理 · HUST BookLoop</title>
<link rel="stylesheet" th:href="@{/prototype/css/style.css}">
<link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<header>
<nav class="nav" aria-label="主导航">
<a class="brand" th:href="@{/}">HUST BookLoop</a>
<div class="navlinks">
<a th:href="@{/admin/reports}">举报队列</a>
<a th:href="@{/admin/reports/history}">处理历史</a>
<a th:href="@{/admin/events}">操作日志</a>
<a th:href="@{/admin/options/majors}">专业管理</a>
<a th:href="@{/admin/options/tags}">标签管理</a>
<a th:href="@{/admin/listings}">资料限制</a>
<a th:href="@{/account}">我的账户</a>
</div>
</nav>
</header>
<main class="admin-page">
<div class="admin-heading">
<div>
<h1 th:text="${label} + '管理'">
</h1>
<p>停用后保留历史资料中的关联，新发布不能选择；勾选启用可恢复使用。不限专业是固定选项。</p>
</div>
</div>
<p class="admin-flash success" th:if="${success}" th:text="${success}" role="status">
</p>
<p class="admin-flash error" th:if="${error}" th:text="${error}" role="alert">
</p>
<section class="admin-record">
<h2 th:text="'新增' + ${label}">
</h2>
<form class="option-form" th:action="@{/admin/options/{kind}(kind=${kind})}" method="post">
<label>名称<input name="name" required th:maxlength="${maxLength}">
</label>
<label>
<input type="checkbox" name="enabled" value="true" checked>启用</label>
<button type="submit">新增</button>
</form>
</section>
<section class="admin-record" th:each="option : ${result.content}">
<form class="option-form" th:action="@{/admin/options/{kind}(kind=${kind})}" method="post">
<input type="hidden" name="id" th:value="${option.id}">
<input type="hidden" name="page" th:value="${result.number}">
<label th:for="'option-' + ${option.id}" th:text="${label} + ' #' + ${option.id}">
</label>
<input th:id="'option-' + ${option.id}" name="name" required th:maxlength="${maxLength}" th:value="${option.name}">
<span th:text="${option.enabled ? '启用中' : '已停用'}">
</span>
<label>
<input type="checkbox" name="enabled" value="true" th:checked="${option.enabled}">启用</label>
<button type="submit">保存</button>
</form>
</section>
<p class="admin-empty" th:if="${result.empty}">还没有选项，请先新增。</p>
<nav class="admin-pagination" aria-label="分页" th:if="${result.totalPages > 1}">
<a th:if="${result.hasPrevious()}" th:href="@{/admin/options/{kind}(kind=${kind},page=${result.number - 1})}">上一页</a>
<span th:text="${result.number + 1} + ' / ' + ${result.totalPages}">
</span>
<a th:if="${result.hasNext()}" th:href="@{/admin/options/{kind}(kind=${kind},page=${result.number + 1})}">下一页</a>
</nav>
</main>
</body>
</html>
