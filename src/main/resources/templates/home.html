<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HUST BookLoop · 开发入口</title>
  <link rel="stylesheet" th:href="@{/prototype/css/style.css}">
  <style>
    main { max-width: 850px; margin: 80px auto; padding: 30px; }
    h1 { font-size: 30px; margin-bottom: 25px; }
    p { color: #78838b; line-height: 1.9; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin: 30px 0; }
    .secondary { padding: 11px 18px; border: 1px solid #ddd; border-radius: 4px; }
  </style>
</head>
<body>
<main>
  <h1>HUST BookLoop</h1>
  <p>Spring Boot 基础工程已启动。</p>
  <p th:text="${databaseMode}">运行模式</p>
  <div class="links">
    <a class="primary" th:href="@{/login}">登录</a>
    <a class="secondary" th:href="@{/register}">注册</a>
    <a class="secondary" th:href="@{/account}">我的账户</a>
    <a class="secondary" th:href="@{/my/listings}">我的发布</a>
    <a class="primary" th:href="@{/market}">进入教材市场</a>
    <a class="secondary" th:href="@{/books/new}">填写发布资料</a>
    <a class="secondary" th:href="@{/prototype/index.html}">查看市场原型</a>
    <a class="secondary" th:href="@{/prototype/my-listings.html}">我的发布原型</a>
    <a class="secondary" th:href="@{/prototype/admin-listings.html}">管理后台原型</a>
  </div>
  <p>账户、市场、详情、资料发布、图片上传和“我的发布”已接入服务端数据库；交易状态可由发布者管理。
    标有“原型”的管理后台和举报页面仍使用浏览器演示数据。</p>
</main>
</body>
</html>
