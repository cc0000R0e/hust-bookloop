<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账户 · HUST BookLoop</title>
  <link rel="stylesheet" th:href="@{/prototype/css/style.css}">
  <link rel="stylesheet" th:href="@{/prototype/css/account.css}">
</head>
<body>
  <header><nav class="nav" aria-label="主导航"><a class="brand" th:href="@{/}">HUST BookLoop</a><div class="navlinks"><a th:href="@{/login}">登录</a><a th:href="@{/register}">注册</a><a th:href="@{/account}">我的账户</a></div></nav></header>
  <main class="account-layout" style="text-align:center">
<h1>欢迎回到 BookLoop</h1>
<p class="muted">使用已注册的账号登录。</p>
<p class="form-feedback" th:if="${param.registered}">注册成功，请登录。</p>
<p class="form-feedback" th:if="${param.logout}">已退出登录。</p>
<p role="alert" style="color:#a04f45" th:if="${param.error}">账号或密码错误，请重试。</p>
<p th:if="${param.passwordChanged}" role="status">密码已修改，请使用新密码登录。</p>
<form th:action="@{/login}" method="post" class="account-form">
  <label>账号<input name="username" required maxlength="40" autocomplete="username"></label>
  <label>密码<input name="password" type="password" required maxlength="64" autocomplete="current-password"></label>
  <button class="primary" type="submit">登录</button>
  <p>还没有账号？ <a th:href="@{/register}">注册账号 →</a></p>
</form>
    <p class="muted">MySQL模式保存真实账号；preview模式仅使用临时数据库，停止服务后数据清空。</p>
  </main>
</body>
</html>
