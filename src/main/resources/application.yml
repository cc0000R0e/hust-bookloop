spring:
  application:
    name: hust-bookloop
  profiles:
    default: preview
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 32MB
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
bookloop:
  upload-dir: ${BOOKLOOP_UPLOAD_DIR:${user.dir}/uploads}
